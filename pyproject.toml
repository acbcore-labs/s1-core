[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s1core"
version = "0.1.0"
description = "S1-Core: a generalized System 1 inference harness — a deterministic control loop around bounded stochastic decision models."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "acbcore-labs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/s1core"]
