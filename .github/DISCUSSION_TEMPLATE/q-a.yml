title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        ## Community Q&A

        Ask a concrete usage, architecture, backend, calibration, audit, or
        deployment question. A good answer should be reconstructible from
        the evidence you provide here.

        If the conversation reveals a definite defect, the maintainers may
        move it into an issue with a bounded reproduction case.
  - type: input
    id: question
    attributes:
      label: Direct question
      placeholder: "How should I calibrate a noul gray zone for...?"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Installation or configuration
        - Specification compiler
        - Deterministic preprocessing
        - DAG and wave scheduling
        - Gates and calibration
        - Audit and replay
        - TypeSafe/Jev backend
        - Custom backend integration
        - Local or shadow backend
        - Public API
        - Documentation and examples
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and context
      description: What are you trying to make work? Include the relevant use case, not only the failing symbol.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected versus actual result
      description: State what you expected, what happened, and whether the result was a fail-closed abstention.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest question spec, state payload, adapter call, command, or configuration that demonstrates the question.
      render: python
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, backend/model, package version or commit, and relevant hardware.
      placeholder: "Python 3.14.0; macOS; s1-core main@0911c30; backend jev-latest"
    validations:
      required: false
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized logs, output, or replay evidence
      description: Paste the smallest relevant output. Audit digests are preferred; never include secrets or private payloads.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Before posting
      options:
        - label: I removed API keys, private state, customer data, and unpublished credentials.
          required: true
