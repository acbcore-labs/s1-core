name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python 3.14 (managed fallback when no system interpreter matches)
        run: uv python install 3.14
      - name: Core stdlib suite (zero-dependency proof)
        run: uv run --no-group dev python -m unittest discover -s tests
      - name: Full suite under the 100% coverage gate
        run: uv run pytest
